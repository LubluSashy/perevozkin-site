<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Перевозкин — скоро открытие</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#040404;
color:white;
font-family:Arial,sans-serif;
min-height:100vh;
overflow:hidden;
}

.bg{
position:fixed;
inset:0;

background:
radial-gradient(circle at center,
rgba(255,188,0,.18),
transparent 30%),

linear-gradient(
180deg,
#050505,
#020202
);

}

.grid{
position:absolute;
inset:0;

background:
linear-gradient(
rgba(255,180,0,.06) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(255,180,0,.06) 1px,
transparent 1px
);

background-size:
120px 120px;

opacity:.35;

transform:
perspective(1000px)
rotateX(70deg)
scale(2);

transform-origin:top;
}

.wrapper{

position:relative;

z-index:5;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

text-align:center;

}

.hero{

max-width:1100px;

}

.logo{

font-size:100px;

color:#fff;

font-weight:900;

letter-spacing:-4px;

text-transform:uppercase;

text-shadow:
0 0 40px rgba(255,200,0,.15);

}

.line{

width:100%;

height:2px;

margin:30px auto;

background:

linear-gradient(
90deg,
transparent,
#ffbe00,
transparent
);

box-shadow:

0 0 40px #ffbe00;

}

.open{

font-size:84px;

font-weight:900;

color:#ffbe00;

text-transform:uppercase;

text-shadow:

0 0 50px
rgba(255,190,0,.6);

}

.card{

margin-top:50px;

padding:40px;

border-radius:30px;

background:

rgba(255,255,255,.03);

border:

1px solid
rgba(255,190,0,.18);

backdrop-filter:

blur(16px);

max-width:900px;

margin-left:auto;

margin-right:auto;

}

.text{

font-size:32px;

line-height:1.5;

}

.sub{

margin-top:20px;

font-size:20px;

color:#ffbe00;

}

.features{

display:flex;

justify-content:center;

gap:20px;

margin-top:50px;

flex-wrap:wrap;

}

.item{

padding:18px 30px;

border:

1px solid
rgba(255,190,0,.25);

border-radius:999px;

background:

rgba(255,190,0,.05);

}

.footer{

margin-top:70px;

color:#ffbe00;

font-size:26px;

}

@media(max-width:900px){

.logo{

font-size:54px;

}

.open{

font-size:48px;

}

.text{

font-size:22px;

}

}

</style>

</head>

<body>

<div class="bg">
<div class="grid"></div>
</div>

<div class="wrapper">

<div class="hero">

<div style="font-size:90px">
🚚
</div>

<div class="logo">
ПЕРЕВОЗКИН
</div>

<div class="line"></div>

<div class="open">
СКОРО ОТКРЫТИЕ
</div>

<div class="card">

<div class="text">
Мы готовим новую платформу
городской логистики
</div>

<div class="sub">
Быстро • Надёжно • Для бизнеса и людей
</div>

</div>

<div class="features">

<div class="item">
⚡ Быстрая подача
</div>

<div class="item">
🛡 Проверенные исполнители
</div>

<div class="item">
📍 Контроль маршрута
</div>

<div class="item">
💳 Безопасная оплата
</div>

</div>

<div class="footer">

Спасибо, что с нами

</div>

</div>

</div>

</body>

</html>
